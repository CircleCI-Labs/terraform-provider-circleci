version: 2.1

orbs:
  go: circleci/go@4.0.0
  terraform: circleci/terraform@3.7.0

# The Go image must match the `toolchain` directive in go.mod. The provider needs
# 1.26 because internal/httpcl uses errors.AsType from the 1.26 standard library,
# and the patch level matters: govulncheck reported seven reachable standard
# library vulnerabilities on 1.26.1, in crypto/tls, crypto/x509, net/http,
# net/textproto and html/template. Keep this in step with go.mod's toolchain.
executors:
  go:
    docker:
      - image: cimg/go:1.26.6@sha256:5d257ec542d76847379b4a92e9c5d573fa0ec7c79c494caa53a9aebd813752df

commands:
  store_results:
    steps:
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  setup:
    parameters:
      terraform-version:
        type: string
    steps:
      - checkout
      - run: task mod-download
      # The acceptance tests drive a real terraform binary, and `task ci:diff`
      # runs `terraform fmt` over examples/.
      - terraform/install:
          terraform_version: <<parameters.terraform-version>>

jobs:
  lint:
    executor: go
    steps:
      # The oldest version in the test matrix below. `task ci:diff` regenerates
      # documentation and runs `terraform fmt`, both of which can change output
      # between minor versions, so generate against the oldest one we support:
      # output that is stable there is stable on the newer ones too.
      - setup:
          terraform-version: "1.13.5"
      - go/with-cache:
          golangci-lint: true
          steps:
            - run: task ci:lint
            # Verifies that generated documentation, formatting and go.mod are
            # committed. This regenerates docs, so it needs terraform on PATH.
            - run: task ci:diff
            # Type-checks every example in examples/ against the provider's
            # real schema. This is here because nothing else looks at those
            # files: they declare no provider and are never applied, so the
            # only check they had was `terraform fmt`, which parses HCL and
            # stops there.
            #
            # Three broken examples were found by three separate routes in a
            # single day — a reader trying one, a docs review, and an ad-hoc
            # script — and every one of them was plausible-looking HCL that
            # only failed at plan time: an attribute that does not exist in the
            # schema, a `file()` pointing at a path nobody had created, and a
            # reference to a resource the example never declared. `terraform
            # fmt` cannot catch any of those, because all three are
            # syntactically fine. Examples are the part of the documentation
            # people copy verbatim, so a broken one is worse than none.
            #
            # Hermetic by construction: dev_overrides points Terraform at the
            # locally built provider, so there is no `terraform init`, no
            # registry call and no credential. It therefore runs on every
            # build rather than behind a flag.
            - run: task validate-examples
            # Reachability-based vulnerability scan. This is here because it
            # actually caught something: 14 reachable vulnerabilities, most of
            # them standard library issues fixed by a Go patch release, plus a
            # gRPC authorization bypass. Dependabot did not surface them for this
            # branch, and a provider binary shipping reachable TLS and x509
            # vulnerabilities is not something to find out about by accident.
            - run: task vulncheck
      - store_results

  build-and-test:
    parameters:
      terraform-version:
        type: string
    executor: go
    steps:
      - setup:
          terraform-version: <<parameters.terraform-version>>
      - run: task build
      - go/with-cache:
          steps:
            - run:
                name: task ci:test
                # CircleCI kills a step that emits nothing for 10 minutes, and this
                # one can. `gotestsum --junitfile` uses its pkgname format, which
                # prints a single line per package, so with three packages the step
                # is silent for minutes at a stretch — and internal/provider alone
                # takes about ten, because its tests drive a real terraform binary.
                # The suite was passing on the merits and being killed anyway.
                #
                # Go's own -timeout is already 120m; this is purely CircleCI's
                # no-output guard, so it needs to be looser than the whole suite
                # rather than looser than any one gap in the output.
                no_output_timeout: 30m
                command: task ci:test
      - run:
          name: Summarize coverage
          when: always
          command: |
            mkdir -p test-reports
            go tool cover -func=test-reports/coverage.out \
              | tee test-reports/coverage.txt \
              | tail -1
      - store_results

  # Runs GoReleaser against a `v*` tag: builds the cross-platform archives,
  # signs the checksum file, and creates the GitHub release the Terraform
  # Registry ingests via webhook. See the `release` workflow below for the
  # context this needs and for the manual cutover steps.
  release:
    executor: go
    steps:
      - checkout
      - run:
          name: Fetch full git history and tags
          command: |
            # GoReleaser diffs against the previous tag and reads full tag
            # history; CircleCI's checkout can leave a shallow clone.
            git fetch --unshallow || true
            git fetch --tags --force
      - run:
          name: Import GPG signing key
          command: |
            set -euo pipefail

            # Needs $GPG_PRIVATE_KEY and $GPG_PASSPHRASE from the context — see
            # the `release` workflow below for exactly how to create them.
            #
            # $GPG_PRIVATE_KEY is the ASCII-armoured secret key, base64-encoded:
            # `gpg --armor --export-secret-keys FPR | base64`. Encoding it avoids
            # any question of how a multi-line value survives being put into an
            # environment variable, which is why the decode below is not optional.
            command -v gpg-connect-agent >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y gnupg)

            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            # allow-preset-passphrase lets the step below seed the agent's
            # passphrase cache, so .goreleaser.yml's `signs:` step (`gpg
            # --batch --local-user ... --detach-sign`) never hits an
            # interactive passphrase prompt. This reproduces, by hand, what
            # crazy-max/ghaction-import-gpg did on the GitHub Actions side.
            # Not a heredoc: a literal double angle bracket in a run command
            # is CircleCI's parameter-substitution syntax, and the config
            # compiler fails to parse the file if one shows up unescaped.
            printf '%s\n' \
              'default-cache-ttl 21600' \
              'max-cache-ttl 31536000' \
              'allow-preset-passphrase' \
              > ~/.gnupg/gpg-agent.conf
            gpgconf --kill gpg-agent || true

            echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --yes --import

            # GPG_FINGERPRINT feeds .goreleaser.yml's `signs.args`
            # ("--local-user {{ .Env.GPG_FINGERPRINT }}"): it must be the
            # fingerprint of the key just imported, and that key must be
            # capable of signing (the primary key, unless it has been
            # stripped down to certify-only with a separate signing subkey).
            FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')
            KEYGRIP=$(gpg --batch --with-colons --with-keygrip --list-secret-keys "$FPR" | awk -F: '$1=="grp"{print $10; exit}')
            HEX_PASSPHRASE=$(printf '%s' "$GPG_PASSPHRASE" | od -An -tx1 | tr -d ' \n' | tr 'a-f' 'A-F')
            gpg-connect-agent "PRESET_PASSPHRASE $KEYGRIP -1 $HEX_PASSPHRASE" /bye >/dev/null

            echo "export GPG_FINGERPRINT=$FPR" >> "$BASH_ENV"
      - run:
          name: Run GoReleaser
          command: |
            # Pinned by version on the command line, not added to go.mod:
            # `go run pkg@version` builds and runs an ephemeral binary
            # without touching this module's go.mod/go.sum. To bump it, change
            # the version below and run `go run
            # github.com/goreleaser/goreleaser/v2@<version> check` locally
            # against .goreleaser.yml first.
            #
            # Also needs $GITHUB_TOKEN from the context, with `contents:
            # write` on this repo: GoReleaser creates the GitHub release and
            # uploads assets to it directly. GitHub Actions got this for free
            # from `secrets.GITHUB_TOKEN`; CircleCI has no equivalent, so this
            # must be a real token (a fine-grained PAT scoped to this repo
            # with "Contents: Read and write" is enough).
            go run github.com/goreleaser/goreleaser/v2@v2.17.1 release --clean

workflows:
  build-and-test:
    jobs:
      - lint
      # One job per supported Terraform version, run in parallel. These used to
      # be chained with `requires`, which serialized three near-identical jobs
      # for no reason: they share no state.
      - build-and-test:
          name: build-and-test-terraform-<<matrix.terraform-version>>
          requires:
            - lint
          matrix:
            parameters:
              # The last three Terraform minor lines. Rotating this matrix — dropping
              # the oldest and adding a new minor — is a judgement call, not a bump,
              # so only the newest slot is tracked automatically. Renovate opens a
              # pull request when a newer patch of the current latest minor appears;
              # when a whole new minor ships, move each entry down by hand.
              terraform-version:
                - "1.13.5"
                - "1.14.9"
                # renovate: terraform
                - "1.15.9"

  release:
    jobs:
      - release:
          context: terraform-provider-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

# Setting up releases (moved here from GitHub Actions)
#
# The `release` job needs a context named `terraform-provider-release`
# (rename it above too, if you call it something else) holding three
# environment variables:
#
#   GPG_PRIVATE_KEY  The ASCII-armored GPG private key export
#                    (`gpg --export-secret-keys --armor <fingerprint>`),
#                    base64-encoded to a single line
#                    (`| base64 | tr -d '\n'`) so it survives CircleCI's
#                    env var input. This is the same key the Terraform
#                    Registry already has the public half of; do not
#                    generate a new one unless the Registry's key is also
#                    being rotated.
#   PASSPHRASE       That key's passphrase, as plain text.
#   GITHUB_TOKEN     A GitHub token with `contents: write` on this repo
#                    (a fine-grained PAT scoped to this repo, "Contents:
#                    Read and write", is enough). GoReleaser uses it to
#                    create the GitHub release and upload the signed
#                    archives, checksums and manifest to it.
#
# Registry precondition, not something this config can arrange: the
# Terraform Registry only ingests releases from a *public* GitHub repository.
#
# Cutover, by hand, in order:
#   1. Create the context and the three variables above.
#   2. Push a `v*` tag and confirm the `release` job here produces a real,
#      correctly signed GitHub release (check the Registry picks it up).
#   3. Only then delete .github/workflows/release.yml. Until step 2 has
#      succeeded at least once, leave it in place — see the comment at the
#      top of that file. Note that if its GPG_PRIVATE_KEY/PASSPHRASE GitHub
#      secrets are still configured from before this move, both workflows
#      will attempt to release the same tag; remove those secrets (or the
#      workflow) rather than leaving both live any longer than step 2 takes.

# Enabling the acceptance tests against a real organization
#
# `task ci:test` sets TF_ACC=1, so the acceptance tests are always attempted.
# Each one skips with a named-variable message unless its fixture is configured,
# so the build is green without any credentials — but it is also only exercising
# the mock-backed tests.
#
# To run them for real, create a context holding CIRCLE_TOKEN plus the
# CIRCLECI_TEST_* variables listed in the README, then add it to the
# build-and-test job:
#
#   - build-and-test:
#       context: <your-context-name>
#       ...
#
# Do not point these at a production organization: the tests create and delete
# contexts, projects, groups and runner resource classes.
