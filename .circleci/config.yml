version: 2.1

# The only way to turn the acceptance workflow on. It defaults to false, so an
# ordinary push or pull request never even compiles those jobs into its
# pipeline — see the `acceptance` workflow at the bottom of this file for why
# that separation matters, and the setup note below it for how the nightly
# schedule sets this to true.
parameters:
  run-acceptance-tests:
    type: boolean
    default: false

orbs:
  go: circleci/go@4.0.0
  terraform: circleci/terraform@3.7.0

# The Go image must match the `toolchain` directive in go.mod. The provider needs
# 1.26 because internal/httpcl uses errors.AsType from the 1.26 standard library,
# and the patch level matters: govulncheck reported seven reachable standard
# library vulnerabilities on 1.26.1, in crypto/tls, crypto/x509, net/http,
# net/textproto and html/template. Keep this in step with go.mod's toolchain.
executors:
  go:
    docker:
      - image: cimg/go:1.26.6@sha256:5d257ec542d76847379b4a92e9c5d573fa0ec7c79c494caa53a9aebd813752df

commands:
  store_results:
    steps:
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: test-reports

  setup:
    parameters:
      terraform-version:
        type: string
    steps:
      - checkout
      - run: task mod-download
      # The acceptance tests drive a real terraform binary, and `task ci:diff`
      # runs `terraform fmt` over examples/.
      - terraform/install:
          terraform_version: <<parameters.terraform-version>>

  # Every step of an acceptance-test job. The four jobs below differ only in
  # their `environment` block, and that is deliberate: which organization a job
  # writes to is then the entire diff when it changes, rather than something
  # buried in a shared parameter list. Nothing secret appears there — the
  # fixture identifiers are org and project UUIDs and slugs, and the one actual
  # credential (CIRCLE_TOKEN) comes from the context.
  acceptance_test:
    steps:
      - run:
          name: Refuse to run anywhere but the labs branch of this repository
          command: |
            set -euo pipefail

            # Defence in depth, not the primary control. The primary controls
            # are the branch filter on each job in the `acceptance` workflow
            # and the fact that the terraform-provider-acc-token context is
            # restricted to this project *and* to the labs branch, which
            # CircleCI enforces before the job starts.
            #
            # This step exists anyway because a pull request from a fork builds
            # under *this* project, with a branch name this config does not
            # choose, so "our config only lists labs" is an argument about
            # intent rather than a guarantee. It fails in three lines and names
            # the reason, which beats discovering it from an API call made with
            # our token on behalf of a branch nobody reviewed.
            if [ "${CIRCLE_BRANCH:-}" != "labs" ]; then
              echo "CIRCLE_BRANCH=${CIRCLE_BRANCH:-<unset>}: the acceptance jobs only run on labs." >&2
              exit 1
            fi

            if [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "This is a pull-request build ($CIRCLE_PULL_REQUEST): the acceptance jobs never run on one." >&2
              exit 1
            fi
      - setup:
          # One Terraform version rather than the matrix. These jobs measure
          # the provider against a live API; build-and-test above already
          # measures it against three Terraform lines, and multiplying the two
          # would quadruple the writes to four real organizations to learn
          # nothing new. Keep this in step with the newest matrix entry by hand
          # — Renovate only tracks the entry marked in that matrix.
          terraform-version: "1.15.8"
      - run: task build
      - go/with-cache:
          steps:
            - run:
                name: task ci:test (internal/provider only)
                environment:
                  # gotestsum's default `pkgname` format prints one line per
                  # package and discards a *passing* package's own stdout —
                  # which is exactly where TestMain writes the VCS coverage
                  # block (internal/provider/vcs_gating_test.go). Checked by
                  # running both formats against this suite: under the default
                  # the block never appears at all, so the summary step below
                  # would have nothing to find and the one question these jobs
                  # exist to answer would be unanswerable. standard-quiet keeps
                  # package output and still omits the per-test PASS lines.
                  GOTESTSUM_FORMAT: standard-quiet
                # Looser than build-and-test's 30m, for that reason plus one
                # more: every step here waits on the real API rather than on an
                # httptest server, and terraform-plugin-testing drives a full
                # plan/apply/destroy per step. Still well inside `ci:test`'s own
                # -timeout of 120m, which is what actually bounds the run.
                no_output_timeout: 45m
                command: |
                  set -euo pipefail

                  mkdir -p test-reports

                  # Only internal/provider. Every acceptance test lives there,
                  # and internal/circleci and internal/httpcl are httptest-only
                  # — build-and-test already runs them three times over, so
                  # running them again here would cost four more copies of the
                  # same evidence.
                  task ci:test -- ./internal/provider/... 2>&1 | tee test-reports/acceptance.log
      - run:
          name: What this run actually exercised
          when: always
          # The logic lives in .circleci/scripts/summarize-acceptance-run.sh,
          # not here, so it can be unit-tested against fixture logs/XML
          # outside a CircleCI job — see summarize-acceptance-run_test.sh next
          # to it. This step is just: run it, and fail the job if it does.
          #
          # It reads two things this job's earlier steps produced
          # (test-reports/acceptance.log, test-reports/tests.xml) and writes
          # test-reports/vcs-coverage.txt, which store_results below persists
          # as this job's artifact.
          command: |
            bash .circleci/scripts/summarize-acceptance-run.sh \
              test-reports/acceptance.log test-reports/tests.xml test-reports/vcs-coverage.txt
      - store_results

jobs:
  lint:
    executor: go
    steps:
      # The oldest version in the test matrix below. `task ci:diff` regenerates
      # documentation and runs `terraform fmt`, both of which can change output
      # between minor versions, so generate against the oldest one we support:
      # output that is stable there is stable on the newer ones too.
      - setup:
          terraform-version: "1.13.5"
      - go/with-cache:
          golangci-lint: true
          steps:
            - run: task ci:lint
            # Verifies that generated documentation, formatting and go.mod are
            # committed. This regenerates docs, so it needs terraform on PATH.
            - run: task ci:diff
            # Type-checks every example in examples/ against the provider's
            # real schema. This is here because nothing else looks at those
            # files: they declare no provider and are never applied, so the
            # only check they had was `terraform fmt`, which parses HCL and
            # stops there.
            #
            # Three broken examples were found by three separate routes in a
            # single day — a reader trying one, a docs review, and an ad-hoc
            # script — and every one of them was plausible-looking HCL that
            # only failed at plan time: an attribute that does not exist in the
            # schema, a `file()` pointing at a path nobody had created, and a
            # reference to a resource the example never declared. `terraform
            # fmt` cannot catch any of those, because all three are
            # syntactically fine. Examples are the part of the documentation
            # people copy verbatim, so a broken one is worse than none.
            #
            # Hermetic by construction: dev_overrides points Terraform at the
            # locally built provider, so there is no `terraform init`, no
            # registry call and no credential. It therefore runs on every
            # build rather than behind a flag.
            - run: task validate-examples
            # Reachability-based vulnerability scan. This is here because it
            # actually caught something: 14 reachable vulnerabilities, most of
            # them standard library issues fixed by a Go patch release, plus a
            # gRPC authorization bypass. Dependabot did not surface them for this
            # branch, and a provider binary shipping reachable TLS and x509
            # vulnerabilities is not something to find out about by accident.
            - run: task vulncheck
      - store_results

  build-and-test:
    parameters:
      terraform-version:
        type: string
    executor: go
    steps:
      - setup:
          terraform-version: <<parameters.terraform-version>>
      - run: task build
      - go/with-cache:
          steps:
            - run:
                name: task ci:test
                # CircleCI kills a step that emits nothing for 10 minutes, and this
                # one can. `gotestsum --junitfile` uses its pkgname format, which
                # prints a single line per package, so with three packages the step
                # is silent for minutes at a stretch — and internal/provider alone
                # takes about ten, because its tests drive a real terraform binary.
                # The suite was passing on the merits and being killed anyway.
                #
                # Go's own -timeout is already 120m; this is purely CircleCI's
                # no-output guard, so it needs to be looser than the whole suite
                # rather than looser than any one gap in the output.
                no_output_timeout: 30m
                command: task ci:test
      - run:
          name: Summarize coverage
          when: always
          command: |
            mkdir -p test-reports
            go tool cover -func=test-reports/coverage.out \
              | tee test-reports/coverage.txt \
              | tail -1
      - store_results

  # The acceptance-test jobs. One per test organization; all four share
  # `acceptance_test` above and differ only in the environment below.
  #
  # Three things are true of every one of them:
  #
  #   * TF_ACC is not set here. `task ci:test` sets it (see Taskfile.yml), so
  #     the acceptance tests are attempted in every job in this file. What
  #     separates these four from build-and-test is the credential and the
  #     fixtures, not the flag.
  #   * Only the identifiers these organizations were provisioned with are set:
  #     the organization, the writable project, its slug, and — as of this
  #     revision — the runner namespace each of these four organizations
  #     already had claimed (see the comment on PROJECT_SLUG/RUNNER_NAMESPACE
  #     below for why those two are safe to add and the rest are not yet).
  #     Everything else the suite reads — STATIC_PROJECT_*, PIPELINE_ID,
  #     TRIGGER_*, SCHEDULED_TRIGGER_ID, CONTEXT_*, WEBHOOK_*, and the static
  #     GH_APP_REPO_* and GH_SERVER_* pairs — is deliberately left unset,
  #     because an unset variable skips with a message naming itself while a
  #     guessed one fails against a nonsense identifier in a way that reads
  #     exactly like a regression. The summary step prints every such skip;
  #     filling them in is a matter of adding lines here as each fixture is
  #     actually created.
  #
  #     CONTEXT_* and WEBHOOK_* stay unset on purpose even though this
  #     revision added full live CRUD coverage for both resources: those tests
  #     now create their own scratch context/webhook per run (the same
  #     pattern TestAccContextResource and TestAccWebhookResource already
  #     used) instead of reading a shared, pre-existing fixture, so they need
  #     nothing beyond ORG_ID/PROJECT_ID here. See context_data_source_test.go,
  #     context_environment_variable_*_test.go and webhook_data_source_test.go.
  #
  #     PROJECT_SLUG is the slug of the same project PROJECT_ID names — no new
  #     object, just its other identifier — and unlocks every test in this
  #     package that was already written against a real project but could not
  #     run in CI for the want of it: TestAccProjectSettingsDataSource and
  #     TestAccProjectEnvironmentVariableResource(Update)/DataSource on all
  #     four jobs, plus TestAccCheckoutKeyResourceNet_DeployKeyLifecycle on
  #     acceptance-gh-oauth alone — it is also gated to github_oauth/bitbucket,
  #     and github_hybrid is a different CIRCLECI_TEST_VCS_TYPE value, so it
  #     stays skipped on acceptance-gh-hybrid even with this set.
  #
  #     RUNNER_NAMESPACE is a self-hosted-runner namespace, claimed once
  #     through circleci_orb_namespace or the CLI and permanent — CircleCI has
  #     no way to delete one (see DeleteNamespace's doc comment in
  #     internal/circleci/namespace.go), so unlike every other fixture here it
  #     cannot be created per test run. All four organizations below already
  #     had one claimed, named after the organization itself, from earlier
  #     manual validation of the runner resource-class and token resources;
  #     this revision only wires the existing name into each job so
  #     TestAccRunnerResourceClass*, TestAccRunnerToken* and
  #     TestAccRunnerTokenResourceLimitLive stop skipping here. [NET, verified
  #     2026-08-22 against every organization below: GET /namespaces?filter
  #     [name]=<name> resolves, and this token can create and then delete a
  #     resource class under it].
  #   * CIRCLECI_TEST_GH_OAUTH_ORG_ID/_ORG_SLUG are set in exactly one job,
  #     acceptance-gh-oauth. They are static fixtures — testGithubOrgID reads
  #     them whatever CIRCLECI_TEST_VCS_TYPE says — and the tests that read them
  #     create and delete real projects (TestAccGithubProjectResource). Setting
  #     them in the GitHub App, hybrid or GitLab job would make that job write
  #     to the OAuth organization, which would force all four jobs into one
  #     serial group to buy two tests acceptance-gh-oauth already runs. Left
  #     unset, they skip by name.
  acceptance-gh-app:
    executor: go
    environment:
      CIRCLECI_TEST_VCS_TYPE: github_app
      # gh-app-cci-1. Slug is circleci/<identifier> because a GitHub App
      # organization is standalone rather than named after the VCS org.
      CIRCLECI_TEST_GH_APP_ORG_ID: e75c804e-7f5c-4506-9dad-03fc86af39d1
      CIRCLECI_TEST_GH_APP_ORG_SLUG: circleci/Va2k7FVcHE7EyFDbRioifr
      CIRCLECI_TEST_GH_APP_ORG_NAME: gh-app-cci-1
      CIRCLECI_TEST_GH_APP_PROJECT_ID: 18ae5fa4-d11c-4fe1-a1a7-fbcae4d037de
      CIRCLECI_TEST_GH_APP_PROJECT_SLUG: circleci/Va2k7FVcHE7EyFDbRioifr/43maL3EYJhT5Q9EMGbc5uF
      CIRCLECI_TEST_GH_APP_RUNNER_NAMESPACE: gh-app-cci-1
    steps:
      - acceptance_test

  acceptance-gh-oauth:
    executor: go
    environment:
      CIRCLECI_TEST_VCS_TYPE: github_oauth
      # gh-oauth-cci-1.
      CIRCLECI_TEST_GH_OAUTH_ORG_ID: 9b55d3de-16b2-445a-882f-a4ca5c8bbafc
      CIRCLECI_TEST_GH_OAUTH_ORG_SLUG: gh/gh-oauth-cci-1
      CIRCLECI_TEST_GH_OAUTH_ORG_NAME: gh-oauth-cci-1
      CIRCLECI_TEST_GH_OAUTH_PROJECT_ID: d8fc5b21-353a-4743-9969-6a24a189527a
      CIRCLECI_TEST_GH_OAUTH_PROJECT_SLUG: gh/gh-oauth-cci-1/project-1
      CIRCLECI_TEST_GH_OAUTH_RUNNER_NAMESPACE: gh-oauth-cci-1
      # The org-move test (TestAccCircleCiProjectOrgUpdateResource) creates a
      # project in ORG_ID and moves it to ALT_ORG_ID. It is gated to
      # github_oauth/bitbucket, so of the four jobs here this is the only one
      # that can run it at all, and it needs a second OAuth-connected
      # organization to move into. gh-oauth-cci-2 is one: a hybrid org's
      # connection is GitHub OAuth (TESTING.md, account #3), the App
      # installation it also carries being irrelevant to a project move.
      #
      # This is why this job and acceptance-gh-hybrid share a serial group
      # below — the move writes a project into the organization that job owns.
      CIRCLECI_TEST_GH_OAUTH_ALT_ORG_ID: 11047c98-2415-4410-98dc-899c86f8d0e5
      CIRCLECI_TEST_GH_OAUTH_ALT_ORG_SLUG: gh/gh-oauth-cci-2
    steps:
      - acceptance_test

  # gh-oauth-cci-2: OAuth-connected and *also* carrying a GitHub App
  # installation. github_hybrid is its own integration key rather than an alias
  # for github_oauth — see TESTING.md, which records the API evidence for the
  # distinction and why no testRequireVCSType-gated test names it yet.
  #
  # gh-oauth-cci-2 is also a CLASSIC (VCS-backed) organization, so
  # testRequireStandaloneOrg's tests skip here too (project_resource_test.go)
  # — every route into a real API call that is GATED to an integration or an
  # organization class in this package is gated to one this job's fixtures
  # are neither, so "Exercised by this run (0)" is not a possibility to
  # expect and shrug off, it is the honest count of THAT metric, and
  # .circleci/scripts/summarize-acceptance-run.sh fails this job on it (the
  # check that catches a job proving nothing — see that script). Leave it
  # failing rather than gating anything to github_hybrid just to make it
  # pass: no test is gated to include github_hybrid today. It stops failing
  # the day a real acceptance test is written that this organization's class
  # or integration actually supports and is gated to include github_hybrid.
  #
  # "(0)" measures only tests that call testRequireVCSType or
  # testRequireStandaloneOrg — it is NOT a count of every real-API call this
  # job makes. Most tests in this package carry no VCS or org-class gate at
  # all, because most resources behave identically everywhere, so they run
  # here same as on any other job and are simply not tallied by that specific
  # instrumentation: circleci_context, circleci_context_environment_variable,
  # circleci_webhook and circleci_runner_resource_class/token all get full
  # live CRUD coverage on THIS job too, from PROJECT_SLUG and
  # RUNNER_NAMESPACE below plus the ORG_ID/PROJECT_ID already set. "This
  # integration genuinely has zero real-API coverage today", a few lines up,
  # is therefore true of the tally this job is checked against, not of what
  # actually reaches CircleCI when this job runs.
  #
  # No ALT_ORG pair. testAltOrgID resolves CIRCLECI_TEST_GH_HYBRID_ALT_ORG_ID
  # under this integration, and a second *hybrid* organization is not something
  # we have; pointing it at an OAuth-only org would be an org move across two
  # different integrations, which is not what the test is measuring. It skips,
  # by name, which is the honest answer.
  acceptance-gh-hybrid:
    executor: go
    environment:
      CIRCLECI_TEST_VCS_TYPE: github_hybrid
      CIRCLECI_TEST_GH_HYBRID_ORG_ID: 11047c98-2415-4410-98dc-899c86f8d0e5
      CIRCLECI_TEST_GH_HYBRID_ORG_SLUG: gh/gh-oauth-cci-2
      CIRCLECI_TEST_GH_HYBRID_ORG_NAME: gh-oauth-cci-2
      CIRCLECI_TEST_GH_HYBRID_PROJECT_ID: 7ffb1015-ec6b-4ac4-b3ec-8a2d1f68944b
      CIRCLECI_TEST_GH_HYBRID_PROJECT_SLUG: gh/gh-oauth-cci-2/project-1
      CIRCLECI_TEST_GH_HYBRID_RUNNER_NAMESPACE: gh-oauth-cci-2
    steps:
      - acceptance_test

  acceptance-gl-cloud:
    executor: go
    environment:
      CIRCLECI_TEST_VCS_TYPE: gitlab
      # gitlab-test. Every testRequireVCSType-gated test skips here: those
      # tests require a GitHub or Bitbucket integration (see TESTING.md's
      # table), and none names gitlab. That is NOT the same as "Exercised by
      # this run (0)", though — gitlab-test's slug below is a STANDALONE
      # ("circleci/…") organization, so testRequireStandaloneOrg's tests
      # (project_resource_test.go) run against it same as they would against
      # any other standalone org, regardless of VCS type. So this job's real
      # coverage is whatever those tests are, not zero, and
      # summarize-acceptance-run.sh fails the job if that ever drops to zero.
      CIRCLECI_TEST_GL_CLOUD_ORG_ID: eea3a305-6eb2-4a6b-b011-9bd71b88c8d2
      CIRCLECI_TEST_GL_CLOUD_ORG_SLUG: circleci/WU9ypMiQgrZYrbiHJUGT13
      CIRCLECI_TEST_GL_CLOUD_ORG_NAME: gitlab-test
      CIRCLECI_TEST_GL_CLOUD_PROJECT_ID: f8a56969-9788-4a89-a73a-f17793625c7f
      CIRCLECI_TEST_GL_CLOUD_PROJECT_SLUG: circleci/WU9ypMiQgrZYrbiHJUGT13/XhpsUwvVpk8E38Cm3syPyQ
      CIRCLECI_TEST_GL_CLOUD_RUNNER_NAMESPACE: gitlab-test
    steps:
      - acceptance_test

  # Runs GoReleaser against a `v*` tag: builds the cross-platform archives,
  # signs the checksum file, and creates the GitHub release the Terraform
  # Registry ingests via webhook. See the `release` workflow below for the
  # context this needs and for the manual cutover steps.
  release:
    executor: go
    steps:
      - checkout
      - run:
          name: Fetch full git history and tags
          command: |
            # GoReleaser diffs against the previous tag and reads full tag
            # history; CircleCI's checkout can leave a shallow clone.
            git fetch --unshallow || true
            git fetch --tags --force
      - run:
          name: Import GPG signing key
          command: |
            set -euo pipefail

            # Needs $GPG_PRIVATE_KEY and $GPG_PASSPHRASE from the context — see
            # the `release` workflow below for exactly how to create them.
            #
            # $GPG_PRIVATE_KEY is the ASCII-armoured secret key, base64-encoded:
            # `gpg --armor --export-secret-keys FPR | base64`. Encoding it avoids
            # any question of how a multi-line value survives being put into an
            # environment variable, which is why the decode below is not optional.
            command -v gpg-connect-agent >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y gnupg)

            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            # allow-preset-passphrase lets the step below seed the agent's
            # passphrase cache, so .goreleaser.yml's `signs:` step (`gpg
            # --batch --local-user ... --detach-sign`) never hits an
            # interactive passphrase prompt. This reproduces, by hand, what
            # crazy-max/ghaction-import-gpg did on the GitHub Actions side.
            # Not a heredoc: a literal double angle bracket in a run command
            # is CircleCI's parameter-substitution syntax, and the config
            # compiler fails to parse the file if one shows up unescaped.
            printf '%s\n' \
              'default-cache-ttl 21600' \
              'max-cache-ttl 31536000' \
              'allow-preset-passphrase' \
              > ~/.gnupg/gpg-agent.conf
            gpgconf --kill gpg-agent || true

            echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --yes --import

            # GPG_FINGERPRINT feeds .goreleaser.yml's `signs.args`
            # ("--local-user {{ .Env.GPG_FINGERPRINT }}"): it must be the
            # fingerprint of the key just imported, and that key must be
            # capable of signing (the primary key, unless it has been
            # stripped down to certify-only with a separate signing subkey).
            FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')
            KEYGRIP=$(gpg --batch --with-colons --with-keygrip --list-secret-keys "$FPR" | awk -F: '$1=="grp"{print $10; exit}')
            HEX_PASSPHRASE=$(printf '%s' "$GPG_PASSPHRASE" | od -An -tx1 | tr -d ' \n' | tr 'a-f' 'A-F')
            gpg-connect-agent "PRESET_PASSPHRASE $KEYGRIP -1 $HEX_PASSPHRASE" /bye >/dev/null

            echo "export GPG_FINGERPRINT=$FPR" >> "$BASH_ENV"
      - run:
          name: Run GoReleaser
          command: |
            # Pinned by version on the command line, not added to go.mod:
            # `go run pkg@version` builds and runs an ephemeral binary
            # without touching this module's go.mod/go.sum. To bump it, change
            # the version below and run `go run
            # github.com/goreleaser/goreleaser/v2@<version> check` locally
            # against .goreleaser.yml first.
            #
            # Also needs $GITHUB_TOKEN from the context, with `contents:
            # write` on this repo: GoReleaser creates the GitHub release and
            # uploads assets to it directly. GitHub Actions got this for free
            # from `secrets.GITHUB_TOKEN`; CircleCI has no equivalent, so this
            # must be a real token (a fine-grained PAT scoped to this repo
            # with "Contents: Read and write" is enough).
            go run github.com/goreleaser/goreleaser/v2@v2.17.1 release --clean

workflows:
  build-and-test:
    jobs:
      - lint
      # One job per supported Terraform version, run in parallel. These used to
      # be chained with `requires`, which serialized three near-identical jobs
      # for no reason: they share no state.
      - build-and-test:
          name: build-and-test-terraform-<<matrix.terraform-version>>
          requires:
            - lint
          matrix:
            parameters:
              # The last three Terraform minor lines. Rotating this matrix — dropping
              # the oldest and adding a new minor — is a judgement call, not a bump,
              # so only the newest slot is tracked automatically. Renovate opens a
              # pull request when a newer patch of the current latest minor appears;
              # when a whole new minor ships, move each entry down by hand.
              terraform-version:
                - "1.13.5"
                - "1.14.9"
                # renovate: terraform
                - "1.15.9"

  release:
    jobs:
      - release:
          context: terraform-provider-release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

  # The acceptance suite, against four real organizations.
  #
  # WHY THIS IS NOT PART OF build-and-test, in either position. These jobs talk
  # to a live installation, so they fail for reasons that have nothing to do
  # with the commit under test: an API blip, a rate limit, an object a killed
  # earlier run never destroyed. Putting that failure rate in front of every
  # push — whether chained after `lint` or run beside it — makes a red build
  # ambiguous, and a red build nobody trusts is worse than no build. There is
  # also a hard reason: the context these jobs need is restricted to the labs
  # branch, so on a pull request they would not skip, they would fail on a
  # missing credential.
  #
  # So they get their own workflow, on its own pipeline, compiled in only when
  # `run-acceptance-tests` is true. A push cannot set it; a scheduled trigger
  # or an authenticated API call can (see the setup note at the end of this
  # file). Nightly is the intended cadence: a live-API regression that appears
  # without a commit is worth catching within a day, and per-commit precision
  # is not something these jobs can offer anyway. The same parameter is how a
  # maintainer runs them on demand after touching a resource — which is the
  # case that matters most, because it is the one where the failure is
  # attributable.
  #
  # WHY ONE SERIAL GROUP PER JOB, RATHER THAN ONE OR FOUR. A serial group
  # serializes pipelines against shared state, so the question is what state
  # is actually shared. It is per organization: every fixture variable set on
  # these jobs names one organization, and the destructive resources — org
  # settings, policy bundles, OIDC claims, groups, projects, runner resource
  # classes — are all org-scoped. Two runs of the *same* job would fight over
  # one organization and must not overlap; no two of these four jobs share an
  # organization, and collapsing any of them into one group would serialize
  # four ~40-minute jobs into a slower nightly for no safety gained.
  #
  # acceptance-gh-oauth and acceptance-gh-hybrid used to share a group here,
  # because acceptance-gh-oauth's org-move test (TestAccCircleCiProjectOrgUpdateResource)
  # moves a project into CIRCLECI_TEST_GH_OAUTH_ALT_ORG_ID, which is set to
  # gh-oauth-cci-2 — acceptance-gh-hybrid's own primary organization. That
  # stopped being true once the test was re-gated onto organization CLASS
  # (testRequireStandaloneOrg in project_resource_test.go, the BUG P4 fix):
  # the move only runs when BOTH the primary and the alt organization are
  # standalone, and acceptance-gh-oauth's primary organization
  # (gh-oauth-cci-1, slug gh/gh-oauth-cci-1) is classic. Reproduced directly —
  # no network call, no CIRCLE_TOKEN needed, since the gate skips before
  # either would be reached — by running the test with exactly this job's
  # environment block:
  #
  #   CIRCLECI_TEST_VCS_TYPE=github_oauth CIRCLECI_TEST_GH_OAUTH_ORG_SLUG=gh/gh-oauth-cci-1 \
  #     TF_ACC=1 go test ./internal/provider/ -run TestAccCircleCiProjectOrgUpdateResource -v
  #   -> SKIP: ... "needs a standalone organization, got the classic org gh/gh-oauth-cci-1"
  #
  # and confirmed no other test reads CIRCLECI_TEST_GH_OAUTH_ALT_ORG_ID/_SLUG
  # (`grep -rl testAltOrgID\|testAltOrgSlug internal/provider/*_test.go` names
  # only that one test and its own fixture helper). So today
  # acceptance-gh-oauth writes only to gh-oauth-cci-1 and acceptance-gh-hybrid
  # writes only to gh-oauth-cci-2 — as disjoint as every other pair of jobs
  # here — and running both at once, concurrently, against their real
  # fixtures showed no interference (see TESTING.md's "Parallel-safe
  # acceptance fixtures" section for that run).
  #
  # Collapse any two of these back into one group the moment a test starts
  # writing something account-wide rather than org-scoped — a shared VCS
  # account, the token's own user, anything not addressed by an org id — or
  # the moment CIRCLECI_TEST_GH_OAUTH_ALT_ORG_ID again points a runnable test
  # at another job's organization. Nothing here does either today.
  acceptance:
    when: << pipeline.parameters.run-acceptance-tests >>
    jobs:
      - acceptance-gh-app:
          # This context holds CIRCLE_TOKEN and nothing else, and is restricted
          # to this project and the labs branch. No other context is requested
          # by these jobs: every other value they need is a fixture identifier,
          # set in plain sight in the job's environment block above.
          context: terraform-provider-acc-token
          # Same idiom as the release job above.
          filters:
            branches:
              only: labs
          serial-group: << pipeline.project.slug >>/acceptance-gh-app
      - acceptance-gh-oauth:
          context: terraform-provider-acc-token
          filters:
            branches:
              only: labs
          serial-group: << pipeline.project.slug >>/acceptance-gh-oauth
      - acceptance-gh-hybrid:
          context: terraform-provider-acc-token
          filters:
            branches:
              only: labs
          serial-group: << pipeline.project.slug >>/acceptance-gh-hybrid
      - acceptance-gl-cloud:
          context: terraform-provider-acc-token
          filters:
            branches:
              only: labs
          serial-group: << pipeline.project.slug >>/acceptance-gl-cloud

# Setting up releases (moved here from GitHub Actions)
#
# The `release` job needs a context named `terraform-provider-release`
# (rename it above too, if you call it something else) holding three
# environment variables:
#
#   GPG_PRIVATE_KEY  The ASCII-armored GPG private key export
#                    (`gpg --export-secret-keys --armor <fingerprint>`),
#                    base64-encoded to a single line
#                    (`| base64 | tr -d '\n'`) so it survives CircleCI's
#                    env var input. This is the same key the Terraform
#                    Registry already has the public half of; do not
#                    generate a new one unless the Registry's key is also
#                    being rotated.
#   PASSPHRASE       That key's passphrase, as plain text.
#   GITHUB_TOKEN     A GitHub token with `contents: write` on this repo
#                    (a fine-grained PAT scoped to this repo, "Contents:
#                    Read and write", is enough). GoReleaser uses it to
#                    create the GitHub release and upload the signed
#                    archives, checksums and manifest to it.
#
# Registry precondition, not something this config can arrange: the
# Terraform Registry only ingests releases from a *public* GitHub repository.
#
# Cutover, by hand, in order:
#   1. Create the context and the three variables above.
#   2. Push a `v*` tag and confirm the `release` job here produces a real,
#      correctly signed GitHub release (check the Registry picks it up).
#   3. Only then delete .github/workflows/release.yml. Until step 2 has
#      succeeded at least once, leave it in place — see the comment at the
#      top of that file. Note that if its GPG_PRIVATE_KEY/PASSPHRASE GitHub
#      secrets are still configured from before this move, both workflows
#      will attempt to release the same tag; remove those secrets (or the
#      workflow) rather than leaving both live any longer than step 2 takes.

# The acceptance tests against real organizations
#
# `task ci:test` sets TF_ACC=1, so the acceptance tests are always attempted,
# in build-and-test as much as in the acceptance jobs. Each one skips with a
# named-variable message unless its fixture is configured, which is why
# build-and-test is green without any credentials — and also why it only ever
# exercises the mock-backed tests.
#
# What supplies the difference is split in two, on purpose:
#
#   * ONE SECRET, in a context. terraform-provider-acc-token holds CIRCLE_TOKEN
#     and nothing else, restricted to this project and to the labs branch.
#   * EVERY FIXTURE IDENTIFIER, in this file, in each job's environment block.
#     Org and project UUIDs and slugs are not secrets, and keeping them here
#     means changing which organization gets written to is a reviewable diff
#     rather than an invisible edit in the context UI.
#
# Do not point any of this at a production organization: the tests create and
# delete organizations, projects, groups, contexts and runner resource classes,
# and replace policy bundles and OIDC claims wholesale. TESTING.md has the full
# blast radius.
#
# One-time setup for the nightly run
#
#   1. Create the context and put CIRCLE_TOKEN in it (an org-admin personal API
#      token that can reach all four organizations). Restrict it to this
#      project and to the labs branch.
#   2. In Project Settings -> Triggers, add a scheduled trigger on the labs
#      branch with the pipeline parameter run-acceptance-tests set to true.
#      Nightly, off-peak.
#   3. To run them on demand, trigger a pipeline with the same parameter:
#
#        curl -X POST https://circleci.com/api/v2/project/<slug>/pipeline \
#          -H "Circle-Token: $CIRCLE_TOKEN" -H 'Content-Type: application/json' \
#          -d '{"branch":"labs","parameters":{"run-acceptance-tests":true}}'
#
# Filling in the rest of the fixtures
#
# Each job sets only the identifiers that exist today. Every acceptance test
# whose fixture is missing prints a skip naming the variable, and the summary
# step collects those skips into test-reports/vcs-coverage.txt as an artifact —
# so the artifact of a green run is also the to-do list for the next one.
