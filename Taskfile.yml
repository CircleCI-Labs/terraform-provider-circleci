version: '3'

vars:
  SERVICE_NAME: terraform-provider-circleci

  # Module path as declared in go.mod. Note it is NOT prefixed with a VCS host.
  MODULE_PATH: terraform-provider-circleci

  RESULTS_DIR: test-reports
  TEST_REPORT: test-reports/tests.xml
  LINT_REPORT: test-reports/lint.xml
  COVERAGE_PROFILE: test-reports/coverage.out

tasks:
  build:
    desc: Build the provider
    cmds:
      - go build -v .

  lint:
    desc: Run `golangci-lint run` to lint the code
    summary: Lint the project with golangci-lint
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool golangci-lint run {{.ARGS}}

  lint-migrate:
    desc: Migrate the `golangci-lint` config
    cmds:
      - go tool golangci-lint migrate

  fmt:
    desc: Format the code
    vars:
      ARGS: '{{default "." .CLI_ARGS}}'
    cmds:
      # -local must match the module path in go.mod (a bare "terraform-provider-circleci"),
      # otherwise the provider's own imports are grouped with the standard library.
      - go tool gosimports -local "{{.MODULE_PATH}}" -w {{.ARGS}}

  test:
    desc: Run the tests
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      # -timeout is generous because internal/provider's tests are not unit tests in
      # the usual sense: terraform-plugin-testing launches a real terraform binary per
      # test case and drives plan/apply/destroy through it. Several hundred of those
      # run here without credentials, against httptest fakes, so the suite takes
      # minutes rather than seconds. It used to be -timeout=120s, which was only ever
      # sufficient because those tests were all skipping — see the note on
      # resource.UnitTest in DESIGN.md. Use `task test:fast` for the inner loop.
      # -parallel=4, not the Go default of GOMAXPROCS. Each test in
      # internal/provider spawns a real terraform binary plus a provider process, so
      # on a 12-core box the default meant 12 concurrent pairs under -race, and the
      # terraform child would occasionally die with SIGSEGV — surfacing as
      # "Error retrieving state, there may be dangling resources: signal:
      # segmentation fault" on a random test that passes in isolation.
      #
      # This costs almost nothing: the full suite is 335s at -parallel=4 versus 326s
      # at 12, because the bottleneck is terraform process startup rather than CPU.
      # Worth keeping low — CI runners are usually smaller than a dev box, so they
      # would hit this harder.
      - go tool gotestsum -- -timeout=30m -parallel=4 -race {{.ARGS}}

  test:fast:
    desc: Run only the fast tests (the API client packages, no terraform binary)
    cmds:
      # internal/circleci and internal/httpcl are ordinary Go tests over httptest
      # servers and finish in about a second. internal/provider is excluded because
      # every test there spawns terraform. This is the inner-loop target; it is not a
      # substitute for `task test` before pushing.
      - go tool gotestsum -- -timeout=2m -parallel=10 -race ./internal/circleci/... ./internal/httpcl/...

  vulncheck:
    desc: Scan for known vulnerabilities that this code can actually reach
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      # govulncheck does reachability analysis rather than version matching, so it
      # reports only vulnerabilities this code can actually call. That precision is
      # the point: it found 14 reachable issues here — seven in the Go standard
      # library (crypto/tls, crypto/x509, net/http, net/textproto, html/template),
      # fixed by a toolchain patch bump, plus a gRPC authorization bypass — none of
      # which Dependabot surfaced for this branch.
      #
      # If this fails on a standard library finding, bump the `toolchain` directive
      # in go.mod and the Go image in .circleci/config.yml together.
      - go tool govulncheck {{.ARGS}}

  generate:
    desc: Run generation of any generated code
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go generate -x {{.ARGS}}

  mod-tidy:
    desc: Run 'go mod tidy' to clean up module files.
    cmds:
      - go mod tidy -v

  mod-download:
    desc: Run 'go mod download' to retrieve module files.
    cmds:
      - go mod download -x

  ci:lint:
    desc: Run `golangci-lint run` to lint the code, outputting a report.
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - task: lint
        vars:
          CLI_ARGS: |
            ./... \
            --output.junit-xml.path "{{.LINT_REPORT}}" --output.junit-xml.extended \
            --output.text.path=stdout --output.text.colors=true

  ci:test:
    desc: Run the tests and output the test results
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    env:
      TF_ACC: '1'
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      # -coverprofile (not just -cover) so the coverage can be summarized and
      # stored as an artifact rather than only printed per package.
      # -parallel=4 for the same reason as `task test` — see the comment there.
      - go tool gotestsum --junitfile="{{.TEST_REPORT}}" -- -race -parallel=4 -coverprofile="{{.COVERAGE_PROFILE}}" -covermode=atomic -timeout 120m -count=1 {{.ARGS}}

  ci:diff:
    desc: Check that generated files are up to date
    cmds:
      - task: generate
      # generate-doc must run explicitly: the go:generate directives live in
      # tools/, a separate module, so `task generate` in the root never reaches
      # them and documentation drift would otherwise go unnoticed.
      - task: generate-doc
      - task: fmt
      - task: mod-tidy
      - git diff --exit-code
      # git diff ignores new files, so a brand-new resource whose docs were never
      # committed would still pass. Fail on any untracked, non-ignored file.
      - |
        untracked="$(git ls-files --others --exclude-standard)"
        if [ -n "$untracked" ]; then
          echo "Generated files are not committed:" >&2
          echo "$untracked" >&2
          exit 1
        fi

  generate-doc:
    desc: Run generation of terraform provider documentation
    dir: tools
    cmds:
      - go generate